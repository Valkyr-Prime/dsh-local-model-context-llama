<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" role="img" aria-label="A context window: a pair of brackets around bars of growing length">
  <!--
    The plugin's idea in one mark: one model's context window, shown as the bars
    that fit inside it, growing with the chosen size. Flat fills, no text, no
    gradients; drawn to stay legible at sidebar row size (about 16-18px).
  -->
  <g fill="#3E6DA6">
    <rect x="9" y="9" width="13" height="3.6" rx="1.8"/>
    <rect x="9" y="16.2" width="18" height="3.6" rx="1.8"/>
    <rect x="9" y="23.4" width="10.5" height="3.6" rx="1.8"/>
  </g>
  <!-- The window itself: two brackets, drawn thicker than the bars they contain. -->
  <g fill="none" stroke="#7FA8D9" stroke-width="2.6" stroke-linecap="round">
    <path d="M6.4 7.2v21.6"/>
    <path d="M29.6 7.2v21.6"/>
  </g>
</svg>
